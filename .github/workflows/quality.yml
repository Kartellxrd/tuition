name: Quality
on:
  push:
    branches: [dev/backend-foundation]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest -q
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
      - run: npm install --no-audit --no-fund
      - run: npx react-native bundle --platform android --entry-file index.js --dev false --bundle-output /tmp/index.android.bundle --assets-dest /tmp/assets
